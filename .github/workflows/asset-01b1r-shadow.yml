name: ASSET-01B1R shadow diagnostic
on:
  push:
    branches:
      - fix/asset-01b1r-birch-shadow-fidelity
  workflow_dispatch:
jobs:
  shadow-rendering:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: asset-lab/birch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Fetch pinned Feh Lu We source read-only
        run: |
          git init "$RUNNER_TEMP/flw-source"
          git -C "$RUNNER_TEMP/flw-source" remote add origin https://github.com/Algolon/Feh-Lu-We.git
          git -C "$RUNNER_TEMP/flw-source" sparse-checkout init --cone
          git -C "$RUNNER_TEMP/flw-source" sparse-checkout set src package.json
          git -C "$RUNNER_TEMP/flw-source" fetch --depth=1 --filter=blob:none origin 17eafb0902833fb1121c77083f9f862eb4ffcd96
          git -C "$RUNNER_TEMP/flw-source" checkout --detach FETCH_HEAD
          cd "$RUNNER_TEMP/flw-source"
          npm install --no-audit --no-fund
      - name: Original geometry parity
        run: FLW_ROOT="$RUNNER_TEMP/flw-source" npm run test:parity
      - name: Capture real shadow baseline and alpha-depth control
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          CHROME_PATH="$CHROME_PATH" SHADOW_PHASE=before npm run capture:shadow
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asset-01b1r-shadow-baseline
          path: asset-lab/birch/shadow-evidence/
          if-no-files-found: warn
