name: UNDERSTORY-ASSET-R04 Separate Botanical WebGL Review
on:
  push:
    branches: [art/understory-asset-r04-substrate-bilberry]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - name: Two independent deterministic asset tests
        run: node --experimental-strip-types --test tests/understory-asset-r04.test.ts
      - run: npx tsc --noEmit
      - run: npx vite build --config vite.understory-asset-r04.config.ts
      - run: npx playwright install --with-deps chromium
      - name: Genuine WebGL A/B/A comparison with 5 views
        env:
          UNDERSTORY_R04_OUTPUT: ${{ runner.temp }}/understory-asset-r04
        run: node tools/understory-asset-r04/browser.mjs
      - name: Preserve screenshot and measured JSON evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: understory-asset-r04-webgl-${{ github.sha }}
          path: ${{ runner.temp }}/understory-asset-r04/
          if-no-files-found: warn
