name: ENV-R02C Authored Gateway WebGL (no deploy)
on:
  push:
    branches: [art/env-r02c-authored-birchwood-gateway]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authored:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: node --experimental-strip-types --test tests/env-r02c.test.ts
      - run: npx vite build --config vite.env-r02c.config.ts
      - run: npx playwright install --with-deps chromium
      - name: Genuine WebGL matched corridor / approach / reveal images
        env:
          ENV_R02C_OUTPUT: ${{ runner.temp }}/env-r02c
        run: node tools/env-r02c/browser.mjs
      - name: Preserve source comparison and spatial delta proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: env-r02c-webgl-${{ github.sha }}
          path: ${{ runner.temp }}/env-r02c/
          if-no-files-found: warn
