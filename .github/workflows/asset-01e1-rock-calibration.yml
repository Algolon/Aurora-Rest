name: ASSET-01E1 rock family migration and geological calibration
on:
  push:
    branches:
      - feature/asset-01e1-rock-family-calibration
  workflow_dispatch:
jobs:
  rock-source-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: asset-lab/birch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - name: All preexisting tree, grass, ground-cover regressions + rock unit tests + typecheck + build
        run: |
          npm test
          npm run build
      - name: Fetch pinned Feh Lu We production source read-only
        run: |
          git init "$RUNNER_TEMP/flw-source"
          git -C "$RUNNER_TEMP/flw-source" remote add origin https://github.com/Algolon/Feh-Lu-We.git
          git -C "$RUNNER_TEMP/flw-source" sparse-checkout init --cone
          git -C "$RUNNER_TEMP/flw-source" sparse-checkout set src package.json
          git -C "$RUNNER_TEMP/flw-source" fetch --depth=1 --filter=blob:none origin 17eafb0902833fb1121c77083f9f862eb4ffcd96
          git -C "$RUNNER_TEMP/flw-source" checkout --detach FETCH_HEAD
          cd "$RUNNER_TEMP/flw-source"
          npm install --no-audit --no-fund
      - name: Independent original birch pine grass and rock geometry parity
        run: |
          FLW_ROOT="$RUNNER_TEMP/flw-source" npm run test:parity
          FLW_ROOT="$RUNNER_TEMP/flw-source" npm run test:pine-parity
          FLW_ROOT="$RUNNER_TEMP/flw-source" npm run test:grass-parity
          FLW_ROOT="$RUNNER_TEMP/flw-source" npm run test:rock-parity
  rock-real-webgl:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: asset-lab/birch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - name: Genuine Chromium and Three.js WebGL rendered rock studies
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          CHROME_PATH="$CHROME_PATH" npm run capture:rocks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asset-01e1-genuine-webgl-rock-review
          path: asset-lab/birch/rock-evidence/
          if-no-files-found: warn
