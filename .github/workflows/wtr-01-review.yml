name: WTR-01 browser smoke (review only)
on:
  push:
    branches: [feature/wtr-01-water-lookdev]
    paths:
      - 'src/wtr-01/**'
      - 'tools/wtr-01/**'
      - 'wtr-01.html'
      - 'vite.config.ts'
      - '.github/workflows/wtr-01-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-review:
    name: Canonical R1 shader smoke and real captures
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Build isolated viewer
        run: npm run build
      - name: Render WebGL ocean and High Tarn captures
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/wtr-preview.log 2>&1 &
          for n in $(seq 1 40); do if curl --fail --silent http://127.0.0.1:4173/wtr-01.html > /dev/null; then break; fi; sleep 1; done
          WTR_OUTPUT=docs/wtr-01/captures node tools/wtr-01/capture.mjs --smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WTR-01-WebGL-smoke-captures
          path: docs/wtr-01/captures/
          if-no-files-found: warn
          retention-days: 14
