name: ENV-R02A isolated visual pilot (no deploy)
on:
  push:
    branches: [art/env-r02a-birchwood-ecotone-pilot]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: node --experimental-strip-types --test tests/env-r02a.test.ts
      - run: npx vite build --config vite.env-r02a.config.ts
      - run: npx playwright install --with-deps chromium
      - name: Genuine WebGL A/B/A matched camera review
        env:
          ENV_R02A_OUTPUT: ${{ runner.temp }}/env-r02a
        run: node tools/env-r02a/browser.mjs
      - name: Preserve actual rendered images and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: env-r02a-ab-images-${{ github.sha }}
          path: ${{ runner.temp }}/env-r02a/
          if-no-files-found: warn
