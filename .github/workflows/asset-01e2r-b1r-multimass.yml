name: ASSET-01E2R-B1R A-B multi-mass calibration
on:
  push:
    branches: [art/asset-01e2r-b1r-multimass-calibration]
  workflow_dispatch:
jobs:
  b1r-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults: {run: {working-directory: asset-lab/birch}}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Guard original B1/CDE, G1, A2 and approved Nature Asset Library against modifications
        run: |
          git diff --exit-code 0f19462163c19189d3d4d4df588b3f6398d028e9 HEAD -- \
            src/rocks/experimental/b1 \
            src/rocks/experimental/a2 \
            src/rocks/experimental/rockSculptR04Core.ts \
            src/rocks/experimental/r04RefinementCore.ts \
            src/rocks/experimental/r04HeroBoulder.ts \
            src/rocks/experimental/r04MaterialStudies.ts \
            src/rocks/index.ts src/rocks/rockMaterials.ts \
            src/pine src/grass src/woodkit.ts src/index.ts
      - run: npm install --no-audit --no-fund
      - name: All unit tests, topology and intersection tests, TypeScript and Vite
        run: |
          npm test
          npm run build
      - name: Fetch protected source commit, strictly read only
        run: |
          git init "$RUNNER_TEMP/flw-source"
          git -C "$RUNNER_TEMP/flw-source" remote add origin https://github.com/Algolon/Feh-Lu-We.git
          git -C "$RUNNER_TEMP/flw-source" sparse-checkout init --cone
          git -C "$RUNNER_TEMP/flw-source" sparse-checkout set src package.json
          git -C "$RUNNER_TEMP/flw-source" fetch --depth=1 --filter=blob:none origin 17eafb0902833fb1121c77083f9f862eb4ffcd96
          git -C "$RUNNER_TEMP/flw-source" checkout --detach FETCH_HEAD
          cd "$RUNNER_TEMP/flw-source"
          npm install --no-audit --no-fund
      - name: Independent birch pine grass and production rock source parity
        run: |
          FLW_ROOT="$RUNNER_TEMP/flw-source" npm run test:parity
          FLW_ROOT="$RUNNER_TEMP/flw-source" npm run test:pine-parity
          FLW_ROOT="$RUNNER_TEMP/flw-source" npm run test:grass-parity
          FLW_ROOT="$RUNNER_TEMP/flw-source" npm run test:rock-parity
  b1r-real-webgl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults: {run: {working-directory: asset-lab/birch}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - name: Chromium Three.js WebGL matched A-B V0 V1 V2 and component/360 evidence
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          CHROME_PATH="$CHROME_PATH" node scripts/capture-rock-b1r.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asset-01e2r-b1r-genuine-webgl-multimass-art-review
          path: asset-lab/birch/rock-b1r-evidence/
          if-no-files-found: warn
