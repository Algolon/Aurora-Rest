<text x="56" y="420" fill="#333">Concept rule: floor 655 m, 130 m wide, gently dished (+3 m at its edges); asymmetric walls: shaded north-facing wall (A2 side) 52°, sunny</text>
<text x="56" y="438" fill="#333">south-facing wall (A1 side) 40°;</text>
<text x="56" y="456" fill="#333">cut only. MEASURED: across this floor station R1 is nearly level (≈ 700 m) for 250 m on the A2 side, because A2 runs 300+ m away, so a</text>
<text x="56" y="474" fill="#333">wall cut here would expose an artificial rim (the V2 failure).</text>
<text x="56" y="492" fill="#333">CONCEPT fix: A1 is the natural north-west rim; on the A2 side a lateral rock rib is left at R1 (about -100…-130 m) and a secondary couloir</text>
<text x="56" y="510" fill="#333">(≤ 18 m) is cut beyond it, so the rib reads as a spur descending from the summit, not as a cut edge.</text>
<text x="56" y="528" fill="#333">Max lowering on this section 46 m.</text>
